server:
  port: 8080
  # OTLP 标准端口是 4318，这里同时暴露 8080（REST）。
  # OTLP 接收路径 /v1/traces 也在 8080，docker-compose 映射 4318:8080 兼容标准。

spring:
  application:
    name: mo-server
  servlet:
    multipart:
      max-file-size: 20MB       # 批量导入允许较大 Excel/JSON 文件
      max-request-size: 21MB
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true        # 每次请求都向服务器校验，避免预览/浏览器复用旧版 index.html
          no-store: true
          must-revalidate: true
  datasource:
    url: ${MO_DB_URL:jdbc:postgresql://localhost:5432/mo}
    username: ${MO_DB_USER:mo}
    password: ${MO_DB_PASSWORD:mo}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: always           # 启动时建表（TimescaleDB 镜像自带扩展）
      schema-locations: classpath:schema.sql
      continue-on-error: true  # hypertable 创建可能失败，不阻断启动

# Memory Observatory 接收与队列配置
mo:
  # ===== 接口鉴权 =====
  # 配置后（环境变量 MO_API_KEY），/api/** 与 /v1/**（OTLP）强制校验
  # 请求头 Authorization: Bearer <key> 或 X-API-Key: <key>；留空为开放模式（仅本地演示）。
  auth:
    api-key: ${MO_API_KEY:}
  ingest:
    queue-capacity: 10000   # ArrayBlockingQueue 容量（旁路容错：满则丢最旧）
    flush-interval-ms: 5000 # 后台批量写库间隔
  # ===== Agent 工作台配置 =====
  # 口令形式：直接填 key，或用 ${ENV_VAR:} 占位符保留环境变量覆盖能力。
  agent:
    provider: ${MO_AGENT_PROVIDER:dashscope}   # dashscope（Qwen）| openai（OpenAI 兼容）
    # --- DashScope（阿里百炼，默认）---
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
    dashscope-model: ${DASHSCOPE_MODEL:qwen3-max}
    # --- OpenAI 兼容（DeepSeek/GLM/…）---
    openai-api-key: ${LLM_API_KEY:}
    openai-model: ${LLM_MODEL:deepseek-chat}
    openai-base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    # --- 可选：web_search（Tavily）/ bash 超时 ---
    tavily-api-key: ${TAVILY_API_KEY:}
    bash-timeout: 60s
    # --- read_file 大文件防护：超 line-cap 行数则不再整体读入上下文，只返回前 head-lines 行 + grep 引导 ---
    read-file-line-cap: ${MO_AGENT_READ_FILE_LINE_CAP:500}
    read-file-head-lines: ${MO_AGENT_READ_FILE_HEAD_LINES:200}
    # --- 工具进度日志开关：[工具进度] 每工具开始/完成一行，便于实时定位当前执行阶段 ---
    tool-progress-log: ${MO_AGENT_TOOL_PROGRESS_LOG:true}
  # ===== 问题分析阈值（找出的"可能问题"判定标准，可在运行前调整）=====
  analytics:
    problems:
      skill-slow-ms: 30000      # Skill 单事件耗时超过该毫秒数，判为"执行时间过长"
      skill-count: 200          # Skill 调用总数超过该值，判为"执行次数过多"
      tool-token: 5000          # 工具(layer=provider) Token 合计超过该值
      turn-token: 5000          # 单 turn 消耗 Token 超过该值
      turn-count: 20            # 单 turn 包含事件超过该值
      turn-tool-count: 8        # 单 turn 调用工具超过该次
      turn-latency-ms: 60000    # 单 turn 墙钟耗时超过该毫秒数
      memory-compressions: 2   # 压缩次数达到该值判为"压缩过于频繁"
      memory-free-ratio: 0.25   # 空闲 Token 比例低于该值判为"记忆近满/膨胀"
      skill-repeat-count: 5     # 单 turn 内同一技能调用超过该次数，判为"被反复调用（循环/震荡）"
      skill-error-count: 0      # 报错（status=failed）次数超过该值，判为"Skill 执行报错"
    flow:                       # 流程分析阈值（docs/流程分析功能设计.md §3.4）
      loop-min-repeats: 3       # 循环判定：窗口内子序列重复次数
      loop-window: 4            # 循环检测滑动窗口最大长度
      s1-burn-token-ratio: 0.40 # S1 烧钱：节点 token 占比超过该值
      s2-slow-p95-ratio: 2.0    # S2 慢：节点 P95 超过全节点 P95 均值的倍数
      s3-loop-join-ratio: 0.30  # S3 循环参与：节点循环参与占比超过该值
      s7-fail-ratio: 0.10       # S7 失败率：节点失败操作占比超过该值
      smell-forget-ratio: 0.30  # 遗忘风暴：EXPIRE 占 trace 操作数比例超过该值
  # ===== 用量监测阈值（Excel 积分消耗导入，UsageController）=====
  usage:
    large-credits: 10         # 单条大额：积分 >= 该值
    short-prompt-len: 30      # 短提问高扣费：提问字符数 <= 该值
    short-burn-credits: 2     #   且积分 >= 该值
    burst-min-count: 5        # 请求风暴：同一客户端同一分钟请求数 >= 该值
    spike-ratio: 3.0          # 小时尖峰：小时消耗 > 小时均值 × 该倍数
    spike-min-credits: 50     #   且小时消耗 >= 该值（避免小基数误报）
  # ===== 语义过滤层（laya 判别式决策引擎，本地自托管，33ms/次）=====
  # 作用：对确定层（阈值/规则/正则）的命中做语义确认，剔除假阳性。默认保留，只在高置信判假阳性时剔除。
  # 后端由 mo-server 启动时自动拉起（Python 进程），已在运行则自动复用；起不来则自动降级，不影响告警。
  # 详见 LAYA-INTEGRATION.md
  semantic:
    enabled: ${MO_SEMANTIC_ENABLED:true}      # 总开关；置 false 则完全回到纯规则行为
    auto-start-backend: true                  # 后端不可达时，用项目自带的 laya-backend 在本机拉起
    backend-dir: ${MO_LAYA_BACKEND_DIR:}      # 项目自带的 laya 后端目录；留空按 ../laya-backend → laya-backend 探测
    python: ""                                # 解释器路径；留空按 <backend-dir>/.venv/bin/python → python3 探测
    auto-bootstrap: ${MO_LAYA_AUTO_BOOTSTRAP:true}   # 本机无 venv 时后台自举（建 venv + 装 laya）；不阻塞启动
    pip-index-url: ${MO_PIP_INDEX_URL:https://pypi.tuna.tsinghua.edu.cn/simple}  # 自举用 pip 源
    bootstrap-timeout-seconds: 1200           # 自举超时上限（秒），要覆盖 torch 下载
    base-url: ${LAYA_BASE_URL:http://127.0.0.1:8770}   # 容器内由 compose 注入 http://laya-backend:8770
    preload: english,multilingual             # 预加载 checkpoint；留空则懒加载（首次请求有冷启动延迟）
    device: ""                                # cpu / mps / cuda；留空自动（macOS Apple Silicon 选 mps）
    ready-timeout-seconds: 180                # 等待「本机拉起」的后端就绪上限（秒）
    external-wait-seconds: 900                # 等待「外部后端」就绪上限（秒）；后台等，不阻塞应用启动
    hf-endpoint: ${HF_ENDPOINT:https://hf-mirror.com}  # 权重下载端点；官方 huggingface.co 在部分网络下不可达，默认走镜像
    top-n: 20                                 # 单次最多送检条数（延迟闸门），超出的候选直接保留
    timeout-ms: 5000                          # 单条判定 HTTP 超时
    threshold-risk: 0.95                      # 内容风险：漏报不可逆，最保守
    threshold-problem: 0.65                   # 问题分析：漏报代价低，可激进
    threshold-loop: 0.75                      # 流程分析循环

logging:
  level:
    io.memobservatory: INFO
