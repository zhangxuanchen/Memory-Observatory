# MemoryObservatory 前端 + HTTP/HTTPS 反代
# - 443: TLS 终止（证书位于 /etc/nginx/certs，entrypoint 缺失时自动生成自签名证书）
# - 80 : 明文 HTTP（本机 8080 入口），与 443 共用同一 server 块的转发与鉴权注入逻辑
# - /api/ 反代到 mo-server:8080（含 SSE 流式支持）
# - /v1/ 反代到 mo-server:8080（OTLP 上报，经 nginx 时同样走 TLS）
# 本文件由 Dockerfile 放入 /etc/nginx/templates/，启动时经 envsubst 替换 ${MO_API_KEY}。

# 本机零配置：8080/5173 均已绑定 127.0.0.1（仅本机可达），浏览器未携带 Authorization 时
# 自动注入 .env 中的 MO_API_KEY；已携带（弹窗手动输入的 key / SDK / 上报脚本）则原样透传。
# .env 未设置 MO_API_KEY（开放模式）时不注入。
map "${MO_API_KEY}" $mo_inject {
    ""      "";
    default "Bearer ${MO_API_KEY}";
}
map $http_authorization $mo_auth {
    ""      $mo_inject;
    default $http_authorization;
}

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 批量导入上限与后端 multipart 20MB 对齐
    client_max_body_size 25m;

    # REST / 工作台 API（含 SSE 流式对话）
    location /api/ {
        proxy_pass http://mo-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 本机零配置鉴权（浏览器未携带时注入 .env 的 MO_API_KEY）
        proxy_set_header Authorization $mo_auth;
        # SSE：关闭缓冲，长连接保活
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OTLP/HTTP 上报（标准路径 /v1/traces）
    location /v1/ {
        proxy_pass http://mo-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $mo_auth;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # 单文件前端应用（CSS/JS 内联在 index.html）：禁用强缓存走协商缓存，
        # 保证重新部署后浏览器立即拿到新版本（未变更时命中 ETag 304）
        add_header Cache-Control "no-cache";
    }
}
