# MemoryObservatory 前端 + HTTPS 反代
# - 443: TLS 终止（证书位于 /etc/nginx/certs，entrypoint 缺失时自动生成自签名证书）
# - 80 : 重定向到 HTTPS
# - /api/ 反代到 mo-server:8080（含 SSE 流式支持）
# - /v1/ 反代到 mo-server:8080（OTLP 上报，经 nginx 时同样走 TLS）

server {
    listen 80;
    server_name _;
    return 301 https://$http_host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 批量导入上限与后端 multipart 20MB 对齐
    client_max_body_size 25m;

    # REST / 工作台 API（含 SSE 流式对话）
    location /api/ {
        proxy_pass http://mo-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE：关闭缓冲，长连接保活
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # OTLP/HTTP 上报（标准路径 /v1/traces）
    location /v1/ {
        proxy_pass http://mo-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
