server:
  port: 8081

spring:
  application:
    name: mo-exoskeleton
  datasource:
    # 与 mo-server 共用同一个库；连接参数走同名环境变量
    url: ${MO_DB_URL:jdbc:postgresql://localhost:5432/mo}
    username: ${MO_DB_USER:mo}
    password: ${MO_DB_PASSWORD:mo}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      # 模块自带的 schema.sql（E1 定案）：启动时建 memory_rules，幂等（IF NOT EXISTS）。
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

# 记忆外骨骼（L6 能学）参数。默认值即设计文档的起点值（§2.4 / §2.7 / §3.2）。
mo:
  auth:
    # 接口鉴权：与 mo-server 同一把 key、同一语义——配置后 /api/** 强制校验
    # Authorization: Bearer <key>（或 X-API-Key）；留空 = 开放模式（仅启动 WARN）。
    # 调用方：mo-server 的 ExoskeletonProxyController 透传浏览器请求的 Authorization；
    # 本机 curl 调试时手动带 -H "Authorization: Bearer $MO_API_KEY"。
    api-key: ${MO_API_KEY:}
  exoskeleton:
    min-support: 30                    # §3.2 最小支撑度：低于它不进候选，只算「不支持」
    churn-weeks: 4                     # §2.7 churn 观察窗（周）
    correction-window-minutes: 10      # §2.4 隐式纠正：相邻 turn 的间隔窗口（分钟）
    correction-similarity: 0.75        # §2.4 隐式纠正：n-gram Jaccard 阈值
    holdout-ratio: 0.2                 # §2.5 对照组裸跑比例（0.1–0.2 起点值；lab05 取 0.25）
    drafter:                           # §4.5 规则撰写器：由谁写草稿（只写不生效）
      # template = 确定性替身（按簇键查表，零密钥、可复现）；llm = 真 LLM 撰写器（复用 tasks.llm 通道）。
      # 二者由 @ConditionalOnProperty 二选一，注入点永远只有一个 RuleDrafter bean。默认替身。
      mode: ${MO_DRAFTER_MODE:template}
    audit:                             # §2.6 自动降级 / §2.7 churn：三道限制 + 调度
      enabled: false                   # 默认关：没配就不跑（§4.7「不能默认给生产加负载」）
      initial-delay-minutes: 1
      interval-minutes: 1440           # 一个「评估周期」= 两次相邻审计；默认一天
      hit-share-max: 0.20              # 限制一：单条规则命中面上限
      constraint-tol: 0.20             # 限制二：命中组约束项相对对照组的容忍
      churn-high: 3                    # §2.7：观察窗（churn-weeks）内版本数达到它 → 撤回
    cards:                             # §4.10 决策卡片
      cap: 5                           # §4.10.5 排序截断：单轮最多出几张，其余排队
      expired-visible: false           # 清单默认隐去「已到期未答」的卡（到期只是不再展示，不改状态）
    tasks:                             # 二级筛选维度：任务类型（session 粒度，LLM 生成）
      enabled: true
      max-sessions-per-run: 200        # 每轮最多分类多少个 session（每 session = 1 次 LLM 调用）
      # 会话摘要送模型的字符上限。2026-10-07 由 4000 上调：本库最大的会话文本也只有 23,544 字符
      # （795 轮，全是短意图摘要），4000 会把 795 轮的会话压成 21 条、丢掉 98% 的提问——「大而杂」
      # 会话被判偏的真正原因是抽样饥饿，不是分类逻辑。本机 Ollama 实测 num_ctx=32768（可容 ~21k token），
      # 3 万字符留足余量，使全量会话都能整段送入（不再触发抽样）。
      digest-max-chars: 30000
      timeout-seconds: 180             # 单次 LLM 调用超时（本机 qwen3:latest 是思考模型，长会话易超时）
      llm:
        # 空 = 不启用（fail-open，端点如实报告未启用，不阻塞）。
        # 注意本地跑 mo-exoskeleton 在宿主机上，应指向 http://localhost:11434/v1；
        # .env 里给容器用的 host.docker.internal 在宿主机上不解析。
        base-url: ${LLM_BASE_URL:}
        model: ${LLM_MODEL:}
        api-key: ${LLM_API_KEY:}
        # 关掉思考链：Qwen3 等思考模型在中长上下文下会生成数千 token 的推理链，长会话必超时。
        # Ollama 的 OpenAI 兼容端点用请求体里的 reasoning_effort 控制，取值 none/low/medium/high；
        # 空 = 不发这个字段（非思考模型无需关，发了反而可能报错）。
        reasoning-effort: ${LLM_REASONING_EFFORT:none}
        # 瞬时失败（IOException / 连接或读超时 / HTTP 5xx）最多重试几次，不含首次；4xx 不重试。
        # 不配也能跑：默认 2 次。
        max-retries: 2
        # 首次重试前的退避毫秒；之后按 ×3 递增（默认 500ms → 500ms、1500ms）。
        retry-backoff-ms: 500
    skills:                            # 技能发现：按任务类型从对话里提炼可复用的工作台技能
      enabled: true
      # 样本门槛：该类 turn 数低于它就不提炼，清单里显示为「未达标」。
      # 与 min-support(30) 同一口径——几条对话里看不出「一类任务的手艺」。
      min-turns: 30
      # 每轮最多提炼几个类（每类 = 1 次 LLM 调用），给成本与耗时兜底。
      max-classes-per-run: 8
      # 该类对话摘要送模型的字符上限（超了按 turn 均匀抽样，首尾必取）。
      digest-max-chars: 20000
      # 取原文时在 SQL 层的抽样上限（每类最多取几条 turn 进摘要）。默认 0 = 不抽样，取全量（行为与从前一致）。
      # 调大只是「少读一点、跑快一点」，但会**改变证据集**（进而改指纹、触发一轮重提炼）——故默认关着，
      # 只在看板卡顿、且能接受重提炼时才显式打开（见登记口 B21）。
      sample-turns: 0
      # 提炼并发度：同时有几类在跑 LLM。默认 1 = 逐类串行（行为与从前一致）；
      # 调大只是缩短墙钟时间，不改变任何判据（类与类互不依赖）。注意模型侧并发压力。
      parallelism: 1
      # ---- 单轮稳定性预算 + 熔断（P2）----
      # 三项默认 0 = 不启用，行为与从前完全一致；命中即「类间」提前停下（调用一旦发出无法中途打断），
      # 返回已完成的局部结果；剩余类下一轮继续（断点续跑靠 class_runs 记账，劳动不丢）；
      # 落库终态记为 HALTED（区别于人取消的 CANCELLED）。
      # 单轮总墙钟时长预算（毫秒）：一轮累计耗时达到它就停下。0 = 不限。
      budget-ms: 0
      # 单轮总 token 预算：一轮累计 token（各次成功调用的 total_tokens 之和）达到它就停下。
      # 比「类数上限」更贴成本——各类摘要长度差几十倍，按类数封顶仍可能一次烧很多。0 = 不限。
      budget-tokens: 0
      # 熔断：LLM 连续失败达到它，即停发后续调用（成功一次清零；跳过 / 空类不改变计数），
      # 防「模型侧持续故障还一路空烧」。已失败的类下轮重试（FAILED 不参与跳过）。0 = 关闭。
      breaker-max-failures: 0
      # 复用 mo.exoskeleton.tasks.llm.* 的 LLM 通道；未配置时本能力如实报未启用，不阻塞。
      gate:                            # 效果验证闸门：采纳前 vs 采纳后对照
        # 每组（前 / 后）的最小样本量：低于它则该组判不了，如实报「不可测」。
        # 与 min-turns(30) / min-support(30) 同一精神——几条对话里看不出「有没有变好」。
        min-sample: 30
        # 比率类判据（纠正率 / 失败率）的绝对容忍（百分点）：采纳后高 5 个百分点以内仍算持平。
        rate-tolerance: 0.05
        # 回合数判据的相对容忍：采纳后多 10% 以内仍算持平。
        rounds-tolerance: 0.10
