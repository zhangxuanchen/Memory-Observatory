services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mo
      POSTGRES_USER: ${MO_DB_USER:-mo}
      # 生产部署请通过环境变量设置强口令：export MO_DB_PASSWORD='强密码'
      POSTGRES_PASSWORD: ${MO_DB_PASSWORD:-mo}
    # 仅绑定本机回环：数据库不应对局域网/公网暴露
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["mo-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MO_DB_USER:-mo}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # laya 语义判定后端（本地推理，不产生 API 费用）。
  # 后端脚本随本仓库分发（laya-backend/），是本项目自有代码，改编自 laya 工作副本中
  # 未入库的 java/backend/server.py（非第三方作品的衍生）。
  # 该目录按 Apache-2.0 分发（与 laya 生态一致）：许可全文见 laya-backend/LICENSE，
  # 来源与名称使用说明见 laya-backend/NOTICE；镜像内为 /licenses/。
  # laya 本体只从 PyPI 安装，不依赖 laya 源码仓库。
  # 首次启动会预检并补下 ~1.5GB 权重到 mo-laya-weights，之后重建容器不用重下。
  laya-backend:
    build: ./laya-backend
    restart: unless-stopped
    # 仅绑本机回环：容器间走服务名，这个映射只为方便本机直接调试后端
    ports: ["127.0.0.1:8770:8770"]
    environment:
      # 官方 huggingface.co 在部分网络下不可达，默认走镜像
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes: ["mo-laya-weights:/data/hf"]
    healthcheck:
      # 首次要下权重 + 加载两个 checkpoint，start_period 给足 10 分钟
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8770/health',timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 600s

  mo-server:
    build: ./mo-server
    restart: unless-stopped
    # 仅 OTLP(4318) 直连容器 8080（SDK/上报脚本自带鉴权头）；REST 与页面统一由
    # mo-dashboard 的 nginx 代理（8080 明文 / 5173 HTTPS，自动注入 MO_API_KEY），
    # mo-server 不再直接暴露宿主端口，避免直连入口漏带 key 被 401 拦截。
    ports: ["127.0.0.1:4318:8080"]
    environment:
      # 容器内用户主目录：与下方挂载配合，「选择工作区」浏览器从挂载点开始，
      # ~/.workbench 工作台配置落在挂载目录、容器重建后不丢。
      HOME: ${MO_HOST_MOUNT_DST:-${HOME:-/root}}
      # JVM 在 Linux 上按 /etc/passwd 解析 user.home（root→/root），不看 HOME，
      # 必须用 -Duser.home 显式指定，否则文件夹浏览器仍从容器内 /root 开始。
      JAVA_TOOL_OPTIONS: "-Duser.home=${MO_HOST_MOUNT_DST:-${HOME:-/root}}"
      MO_DB_URL: jdbc:postgresql://postgres:5432/mo
      MO_DB_USER: ${MO_DB_USER:-mo}
      MO_DB_PASSWORD: ${MO_DB_PASSWORD:-mo}
      # 语义层：laya 后端在同一个 compose 网络里，走服务名访问。
      # 容器内的 mo-server 不负责拉起后端（它拉起的是 compose 里的这个服务），
      # 只等它就绪 + 做一次中文自检；拿不到就 fail-open，不影响现有告警。
      MO_SEMANTIC_ENABLED: ${MO_SEMANTIC_ENABLED:-true}
      LAYA_BASE_URL: http://laya-backend:8770
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      # 接口鉴权：设置后 /api/** 与 /v1/** 强制校验 Authorization: Bearer <key>；
      # 留空为开放模式（仅本地演示）。./install.sh 首次运行会自动生成随机密钥
      # 写入根目录 .env（compose 自动加载，无需手动 export）；生产环境可在
      # .env 中改为强密钥，或 export MO_API_KEY=<key> 覆盖。
      MO_API_KEY: ${MO_API_KEY:-}
      # Agent AK 落盘加密密钥；留空时首次启动自动生成随机密钥持久化到挂载目录
      # ~/.workbench/.crypto-secret（0600）。生产环境建议显式设置。
      MO_AGENT_CRYPTO_SECRET: ${MO_AGENT_CRYPTO_SECRET:-}
      # .log 导入的「大模型格式化」需要 DashScope key；留空时该模式会提示未配置，
      # 可在导入弹窗取消勾选「启用大模型格式化解析」改走 JSON 直传模式。
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      # 只等它启动，不等健康：laya-backend 首次要补下权重（数分钟），
      # 让它阻塞 mo-server 启动没有意义。mo-server 侧会等后端就绪，
      # 期间语义层处于 fail-open（保留全部候选），应用本身照常可用。
      laya-backend:
        condition: service_started
    volumes:
      # 宿主机目录挂载（隐私注意）：
      # 默认挂载【整个家目录】，工作台文件浏览器与工作区 Agent 可读写其中全部文件，
      # 这是本地单机工具的便利性取舍。多用户/生产环境应收窄为指定工作目录，例如：
      #   export MO_HOST_MOUNT_SRC="$HOME/Documents" MO_HOST_MOUNT_DST="$HOME/Documents"
      # 容器内将只能访问该目录；不需要文件浏览时可设为空串并删除本行使其完全不挂载。
      - "${MO_HOST_MOUNT_SRC:-${HOME:-/root}}:${MO_HOST_MOUNT_DST:-${HOME:-/root}}"

  mo-dashboard:
    build:
      context: .
      dockerfile: mo-dashboard/Dockerfile
    restart: unless-stopped  # Docker/开机重启后自动拉起
    # 8080(明文 HTTP) 与 5173(HTTPS) 双入口，均绑定本机回环：工作台可读写家目录
    # 文件，不对局域网/公网暴露；远程访问需自行改绑定并评估风险（届时 nginx 的
    # 自动注入也会对该入口生效）。
    ports: ["127.0.0.1:8080:80", "127.0.0.1:5173:443"]
    environment:
      # 传给 nginx 启动模板：浏览器请求未携带 Authorization 时注入该 key，
      # 本机打开 https://localhost:5173 零配置可用；手动携带的 key 原样透传。
      MO_API_KEY: ${MO_API_KEY:-}
    volumes: ["mo-certs:/etc/nginx/certs"]
    depends_on: [mo-server]

volumes:
  mo-pg: {}
  mo-certs: {}
  # laya 权重缓存（~1.5GB）：持久化后重建容器/更新镜像都不用重下
  mo-laya-weights: {}
